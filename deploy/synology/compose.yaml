# Torrent Search on a Synology NAS (Container Manager → Project).
# Put this file, .env and (optionally) the image tarball in one NAS folder,
# e.g. /volume1/docker/torrent-search, and create a project from it.
services:
  torrent-search:
    container_name: torrent-search
    image: torrent-search-mcp:latest
    restart: unless-stopped
    init: true
    command: ["torrent-search-mcp", "--mode", "fastapi"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Container path of the download folder mounted below.
      LIBRARY_DIR: /downloads
    volumes:
      # The shared folder Download Station saves into (= SYNOLOGY_DESTINATION).
      - ${DOWNLOADS_PATH:-/volume1/downloads}:/downloads
    extra_hosts:
      # Lets the container reach DSM on the NAS itself.
      - "host.docker.internal:host-gateway"
    dns:
      # Public resolvers: sidesteps ISP DNS blocks on torrent sites.
      - 9.9.9.9
      - 149.112.112.112
    shm_size: "512m" # headless Chromium needs more than Docker's 64 MB default
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sources', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
